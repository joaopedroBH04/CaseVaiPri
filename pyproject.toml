[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vaipri-ref"
version = "0.1.0"
description = "Buscador de referencias de trafego pago para clinicas medicas"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Joao Pedro" }]
keywords = ["meta-ads", "instagram", "medical-marketing", "automation"]

dependencies = [
  "anthropic>=0.40.0",
  "httpx>=0.27.0",
  "playwright>=1.45.0",
  "pydantic>=2.7.0",
  "python-dotenv>=1.0.1",
  "typer>=0.12.0",
  "rich>=13.7.0",
  "diskcache>=5.6.3",
  "tenacity>=8.5.0",
  "beautifulsoup4>=4.12.0",
  "lxml>=5.2.0",
  "streamlit>=1.36.0",
  "pandas>=2.2.0",
  "jinja2>=3.1.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.5.0",
]

[project.scripts]
vaipri-ref = "vaipri_ref.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/vaipri_ref"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--tb=short -q"
